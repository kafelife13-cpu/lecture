name: 클리닉 시험지 수령 후 미채점 안내
# Owner approved recurring sends without per-message confirmation on 2026-10-28 KST.
# Intended schedule: 08:00 KST (23:00 UTC), with delayed-run recovery until 10:00 KST.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0,15,30,45 23 * * *"
    - cron: "0,15,30,45 0 * * *"
concurrency:
  group: clinic-home-reminders
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/clinic-home-reminder.mjs
        env:
          SOLAPI_SEND_PIN: ${{ secrets.SOLAPI_SEND_PIN }}
