name: 영상 미시청 3일 문자 안내

# Disabled at owner's request after unintended historical reminder sends.
# No scheduled or push-triggered sends; manual runs also skip the job.
on:
  workflow_dispatch: {}

jobs:
  remind:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/video-watch-reminder.mjs
        env:
          SOLAPI_SEND_PIN: ${{ secrets.SOLAPI_SEND_PIN }}
