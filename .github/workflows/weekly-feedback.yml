name: Weekly feedback checks
on:
  pull_request:
    paths: ['tools/weekly-feedback/**', 'tests/weekly-feedback*.cjs', 'tests/drive-connector-import.cjs', 'tests/test_drive_index.py', 'scripts/check-odap-drive.cjs', 'odap/private-weekly*', 'odap/student*', 'supabase/odap/private-weekly.sql', 'supabase/functions/odap-private-weekly/**', 'scripts/check-odap-private-weekly*.cjs', 'odap/weekly-*.js', 'odap/drive-core.js', 'odap/drive.js', 'odap/cloud.js', 'odap/index.html', '.github/workflows/weekly-feedback.yml']
  push:
    branches: [main]
    paths: ['tools/weekly-feedback/**', 'tests/weekly-feedback*.cjs', 'tests/drive-connector-import.cjs', 'tests/test_drive_index.py', 'scripts/check-odap-drive.cjs', 'odap/private-weekly*', 'odap/student*', 'supabase/odap/private-weekly.sql', 'supabase/functions/odap-private-weekly/**', 'scripts/check-odap-private-weekly*.cjs', 'odap/weekly-*.js', 'odap/drive-core.js', 'odap/drive.js', 'odap/cloud.js', 'odap/index.html', '.github/workflows/weekly-feedback.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weekly-feedback-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node --test tests/weekly-feedback.cjs tests/weekly-feedback-api.cjs
      - run: node tests/drive-connector-import.cjs
      - run: npm install --no-save --ignore-scripts @electric-sql/pglite@0.5.8
      - run: node scripts/check-odap-drive.cjs
      - run: node scripts/check-odap-private-weekly.cjs
      - run: node scripts/check-odap-private-weekly-ui.cjs
      - run: node tools/weekly-feedback/batch.cjs --demo "$RUNNER_TEMP/weekly-synthetic"
      - run: python -m pip install PyMuPDF==1.26.7 olefile==0.47
      - run: python tests/test_drive_index.py
