<!doctype html>
<html lang="ko">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
 <meta name="theme-color" content="#254e46">
 <meta name="referrer" content="no-referrer">
 <title>서로국어 운영</title>
 <link rel="manifest" href="ops-manifest.json">
 <link rel="apple-touch-icon" href="icon-192.png?v=2">
 <link rel="stylesheet" href="ops.css?v=20261119b">
 <script src="sms-approval.js?v=20261118" defer></script>
 <script src="video-chapters.js?v=20261119" defer></script>
 <script src="ops.js?v=20261119g" defer></script>
</head>
<body>
 <main>
  <header><div><p class="eyebrow">선생님 전용</p><h1>서로국어 운영</h1></div><button id="ops-logout" type="button" hidden>잠그기</button></header>
  <form id="ops-login">
   <h2>운영 앱 열기</h2>
   <label for="ops-password">선생님 비밀번호</label>
   <input id="ops-password" type="password" autocomplete="current-password" required>
   <button id="ops-login-button" type="submit">확인</button>
   <p>이 창을 닫으면 다시 로그인합니다.</p>
   <p>휴대폰 브라우저 메뉴에서 ‘홈 화면에 추가’를 선택하면 별도 앱으로 사용할 수 있습니다.</p>
  </form>
  <p id="ops-message" role="status" aria-live="polite"></p>
  <section id="ops-app" hidden aria-label="운영 현황">
   <nav aria-label="운영 메뉴">
    <button type="button" data-ops-tab="today" aria-pressed="false">오늘 체크리스트</button>
    <button type="button" data-ops-tab="pending" aria-pressed="true">문자 승인</button>
    <button type="button" data-ops-tab="absence" aria-pressed="false">미등원 승인</button>
    <button type="button" data-ops-tab="daily" aria-pressed="false">클리닉 명단</button>
    <button type="button" data-ops-tab="weekly" aria-pressed="false">이번 주 명단</button>
    <button type="button" data-ops-tab="videos" aria-pressed="false">영상 시청</button>
    <button type="button" data-ops-tab="board" aria-pressed="false">자동화 현황</button>
    <button type="button" data-ops-tab="history" aria-pressed="false">최근 기록</button>
    <button type="button" data-ops-tab="texts" aria-pressed="false">문자 문구</button>
   </nav>
   <div class="toolbar"><h2 id="ops-title">문자 승인</h2><button id="ops-refresh" type="button">새로고침</button></div>
   <div id="ops-content" aria-busy="false"></div>
  </section>
 </main>
</body>
</html>
