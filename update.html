<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4f7cff">
<title>국어왕 업데이트</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1117;color:#e8eaf0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;text-align:center}
.box{padding:28px}.spin{width:34px;height:34px;margin:0 auto 18px;border:4px solid #2a3144;border-top-color:#4f7cff;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
h1{font-size:20px;margin:0 0 8px}p{font-size:13px;color:#8b90a0;margin:0}
</style>
</head>
<body><div class="box"><div class="spin"></div><h1>국어왕 최신 버전으로 업데이트 중</h1><p>잠시만 기다리면 자동으로 열립니다.</p></div>
<script>
(async function(){
  try{
    if('serviceWorker' in navigator){
      var regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(function(reg){return reg.unregister();}));
    }
    if('caches' in window){
      var keys=await caches.keys();
      await Promise.all(keys.map(function(key){return caches.delete(key);}));
    }
  }catch(e){}
  location.replace('./?v=e70d8df&updated='+Date.now());
})();
</script></body>
</html>
